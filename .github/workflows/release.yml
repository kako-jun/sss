name: Release Build

# 注意: このワークフローは成果物の Developer ID による署名・公証をしない（macOS は ad-hoc 署名のみ）。macOS Gatekeeper /
# Windows SmartScreen の警告が初回起動時に出るため、回避手順のユーザー向け案内は
# README の「未署名アプリの警告について」に記載している。

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      changelog-anchor: ${{ steps.changelog.outputs.anchor }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate release preconditions
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          DISPATCH_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "::error::リリースは main ブランチから実行してください（現在: $DISPATCH_REF）"
            exit 1
          fi

          if ! [[ "$INPUT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version の形式が不正です（例: v1.0.0, v1.0.0-beta.1）: $INPUT_VERSION"
            exit 1
          fi

          # Release は draft で作り、全ジョブ成功後の publish ジョブで初めて公開する。draft の間は
          # タグが作られないため、リモートにタグがある＝公開済み（または手動で作られた）バージョンとみなして拒否する。
          # 前回失敗で残った draft Release は cleanup-draft ジョブが削除して作り直す。
          if git ls-remote --tags origin "refs/tags/$INPUT_VERSION" | grep -q .; then
            echo "::error::タグ $INPUT_VERSION は既に存在します。公開済みのバージョンは再実行できません（新しいバージョンを使うか、タグと Release を手動で整理してください）"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Check version consistency
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          EXPECTED_VERSION="${INPUT_VERSION#v}"
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          echo "input=$INPUT_VERSION (normalized: $EXPECTED_VERSION)"
          echo "tauri.conf.json=$TAURI_VERSION Cargo.toml=$CARGO_VERSION package.json=$PACKAGE_VERSION"

          if [ "$EXPECTED_VERSION" != "$TAURI_VERSION" ] || [ "$EXPECTED_VERSION" != "$CARGO_VERSION" ] || [ "$EXPECTED_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::バージョン不一致: input=$INPUT_VERSION(=$EXPECTED_VERSION) tauri.conf.json=$TAURI_VERSION Cargo.toml=$CARGO_VERSION package.json=$PACKAGE_VERSION"
            exit 1
          fi

      - name: Resolve CHANGELOG section anchor
        id: changelog
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          EXPECTED_VERSION="${INPUT_VERSION#v}"
          HEADING_LINE=$(grep -F -m1 "## [$EXPECTED_VERSION]" CHANGELOG.md || true)
          if [ -z "$HEADING_LINE" ]; then
            echo "::error::CHANGELOG.md に [$EXPECTED_VERSION] の節がありません。リリース前に CHANGELOG.md を更新してください。"
            exit 1
          fi
          ANCHOR=$(node -e "
            const heading = process.argv[1].replace(/^##\s*/, '');
            const anchor = heading.toLowerCase().replace(/[.\[\]]/g, '').replace(/ /g, '-');
            console.log(anchor);
          " "$HEADING_LINE")
          echo "anchor=$ANCHOR" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

  cleanup-draft:
    # 前回の実行が失敗して残った同名の draft Release を削除する（draft は未公開なので消しても影響しない）。
    # 公開済みの同名 Release がある場合は失敗させる。draft はタグを作らないため、タグ有無では検出できない。
    needs: validate
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Remove leftover draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$RELEASE_VERSION\") | \"\(.id) \(.draft)\"")
          while read -r id draft; do
            [ -n "$id" ] || continue
            if [ "$draft" != "true" ]; then
              echo "::error::$RELEASE_VERSION は既に公開済みの Release があります"
              exit 1
            fi
            echo "前回の draft Release (id=$id) を削除します"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done <<<"$releases"

  build:
    needs: [validate, cleanup-draft]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.version }}
          releaseName: 'Smart Slide Show ${{ github.event.inputs.version }}'
          releaseBody: 'See https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md#${{ needs.validate.outputs.changelog-anchor }} for details.'
          # 全資産の検証と Windows ZIP の添付が済むまで公開しない。公開は publish ジョブで行う
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify ad-hoc signature (macOS only)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "::error::.app が 1 つ見つかりません: ${apps[*]:-なし}"
            exit 1
          fi
          app="${apps[0]}"
          codesign --verify --deep --strict --verbose=2 "$app"
          info=$(codesign -dv --verbose=4 "$app" 2>&1)
          echo "$info"
          # Signature=adhoc だけではリンカー署名のみの状態と区別できない。signingIdentity が誤って実証明書に変わった場合の検出用
          grep -q 'Signature=adhoc' <<<"$info" || { echo "::error::Signature=adhoc ではありません"; exit 1; }
          grep -q 'Sealed Resources version=' <<<"$info" || { echo "::error::Sealed Resources が封印されていません"; exit 1; }
          if grep -q 'linker-signed' <<<"$info"; then
            echo "::error::リンカー署名のみです（linker-signed）"
            exit 1
          fi
          if grep -q 'Info.plist=not bound' <<<"$info"; then
            echo "::error::Info.plist が束縛されていません"
            exit 1
          fi

  windows-portable:
    # macOS/Linux の tauri-action が作った draft Release へ、Windows の
    # portable ZIP を追加する。NSIS/WiX installer は生成しない。
    needs: [validate, build]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build portable Windows executable
        run: npm run tauri build -- --no-bundle

      - name: Package portable Windows executable
        id: package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          $version = $env:RELEASE_VERSION -replace '^v', ''
          $archive = "Smart.Slide.Show_${version}_x64-portable.zip"
          $executable = 'src-tauri\target\release\sss.exe'
          if (!(Test-Path -Path $executable -PathType Leaf)) {
            throw "Missing portable executable: $executable"
          }
          Compress-Archive -Path $executable -DestinationPath $archive
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Attach portable ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: gh release upload "$env:RELEASE_VERSION" "$env:ARCHIVE" --repo "$env:GITHUB_REPOSITORY" --clobber

  publish:
    # build（macOS 署名検証を含む）と windows-portable がすべて成功した後にだけ draft を外して公開する。
    # 公開時にタグ（Release 作成時のコミット）が作られる。
    needs: [validate, build, windows-portable]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$RELEASE_VERSION\" and .draft == true) | .id")
          if [ -z "$id" ] || [ "$(wc -w <<<"$id")" -ne 1 ]; then
            echo "::error::$RELEASE_VERSION の draft Release を 1 つに特定できません: '$id'"
            exit 1
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false
