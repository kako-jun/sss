[package]
name = "sss"
version = "1.0.0"
description = "Smart Slide Show - A photo slideshow application for viewing 100k+ photos"
authors = ["kako-jun"]
license = "MIT"
repository = ""
edition = "2021"

# lib+bin 分割: バックエンドの芯を結合テスト (tests/golden_e2e.rs) から呼べるように
# ライブラリターゲットを公開する。bin (src/main.rs) は run() を呼ぶだけの薄い殻。
# `_lib` サフィックスは Windows での lib/bin 名衝突回避のため (cargo#8519)。
[lib]
name = "sss_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
globset = "0.4"
walkdir = "2"
kamadak-exif = "0.6"
rand = "0.8"
rayon = "1"
image = "0.25"
md5 = "0.7"
keepawake = "0.4"
dirs = "5"
# #82 should3: OSロケール取得（tauri-plugin-osを避けcapabilityを増やさないための
# 素の#[tauri::command]用）。
sys-locale = "0.3"
tauri-plugin-single-instance = { version = "2" }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"

# `test` フィーチャは resolver v2 (edition 2021) のため通常ビルドには混入しない。
# get_next_image 等の #[tauri::command] を tauri::test::mock_app() 経由で
# 直接呼ぶ結合テスト用（#60: 存在しないファイルで表示回数が加算されないことの検証）。
[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
