[package]
name = "sss"
version = "1.1.0"
description = "Smart Slide Show (SSS) - A photo slideshow application for viewing 100k+ photos"
authors = ["kako-jun"]
license = "MIT"
repository = "https://github.com/kako-jun/sss"
edition = "2021"

# lib+bin 分割: バックエンドの芯を結合テスト (tests/golden_e2e.rs) から呼べるように
# ライブラリターゲットを公開する。bin (src/main.rs) は run() を呼ぶだけの薄い殻。
# `_lib` サフィックスは Windows での lib/bin 名衝突回避のため (cargo#8519)。
[lib]
name = "sss_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# #69レビュー: 下限を明示（bareな"2"だとJS側(@tauri-apps/*)だけ先行更新されても
# 気付けず minor 不一致が再発するため、各tauri系クレートは現在揃えたバージョンを
# 下限として固定する）。tauri-build 自体は tauri 本体と別のバージョン系列。
tauri-build = { version = "2.7", features = [] }

[dependencies]
# JS側 @tauri-apps/api・cli と同じ 2.12 系を下限にする（#69レビュー）。
tauri = { version = "2.12", features = ["protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40", features = ["bundled"] }
globset = "0.4"
walkdir = "2"
kamadak-exif = "0.6"
# #69レビュー: 完全平等ランダムの趣旨に合わせ、整数範囲サンプリング（`Rng::random_range`。
# playlist.rs で新規画像を巡へ挿入する際の比率抽選に使用）を、ごく僅かな理論上の
# バイアスも許さない厳密一様な方式にする。なお `SliceRandom::shuffle` は要素数が
# u32::MAX 未満（常にこれに該当）の場合このフィーチャに依存しない専用の一様アルゴリズム
# (`IncreasingUniform`、Durstenfeld版Fisher–Yates) を使うため影響を受けない。
rand = { version = "0.9", features = ["unbiased"] }
rayon = "1"
image = "0.25"
md5 = "0.8"
keepawake = "0.6"
dirs = "7"
# #82 should3: OSロケール取得（tauri-plugin-osを避けcapabilityを増やさないための
# 素の#[tauri::command]用）。
sys-locale = "0.3"
# 各プラグインは対応する JS パッケージ（@tauri-apps/plugin-*）の minor に揃える
# （#69レビュー）。plugin-single-instance は JS 側を持たないため自身の現行版を下限にする。
tauri-plugin-single-instance = { version = "2.5" }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.6"
tauri-plugin-process = "2.4"
# #78: 前回のウィンドウ状態（全画面/ウィンドウ・位置・サイズ・装飾）を記憶して復元する。
# 保存先ディスプレイが外れていれば復元を諦める（プラグイン側で実在モニタとの交差を確認）。
tauri-plugin-window-state = "2.4"

# `test` フィーチャは resolver v2 (edition 2021) のため通常ビルドには混入しない。
# get_next_image 等の #[tauri::command] を tauri::test::mock_app() 経由で
# 直接呼ぶ結合テスト用（#60: 存在しないファイルで表示回数が加算されないことの検証）。
[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
